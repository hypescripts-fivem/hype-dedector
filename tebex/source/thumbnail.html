<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #111111;
    --line: rgba(255,255,255,.10);
    --text: #ffffff;
    --muted: #a1a1a1;
    --accent: #f87171;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; background: var(--bg); overflow: hidden; }
  body { font-family: "Plus Jakarta Sans", sans-serif; color: var(--text); position: relative; }

  /* background: thin grid + soft light */
  .grid {
    position: absolute; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 64px 64px;
    mask-image: radial-gradient(ellipse 70% 80% at 70% 45%, #000 20%, transparent 75%);
  }
  .glow {
    position: absolute; width: 1300px; height: 1000px; right: -260px; top: -120px;
    background: radial-gradient(closest-side, rgba(255,255,255,.08), transparent);
  }
  .glow-accent {
    position: absolute; width: 900px; height: 700px; right: 120px; bottom: -320px;
    background: radial-gradient(closest-side, rgba(248,113,113,.16), transparent);
  }

  /* left column */
  .left { position: absolute; left: 112px; top: 96px; bottom: 96px; width: 880px; display: flex; flex-direction: column; z-index: 5; }
  .brand { display: flex; align-items: center; gap: 18px; }
  .brand img { width: 46px; height: 48px; }
  .brand .name { font-size: 30px; font-weight: 700; letter-spacing: -.01em; }
  .brand .sep { width: 1px; height: 30px; background: var(--line); }
  .brand .tag { font-size: 24px; color: var(--muted); font-weight: 500; }

  .pill {
    margin-top: auto; align-self: flex-start;
    display: inline-flex; align-items: center; gap: 14px;
    padding: 12px 22px; border-radius: 999px;
    border: 1px solid var(--line); background: #121212;
    font-size: 24px; font-weight: 600; color: #e5e5e5;
  }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 6px rgba(248,113,113,.2), 0 0 18px rgba(248,113,113,.85); }

  h1 { margin-top: 30px; font-size: 138px; white-space: nowrap; line-height: .94; font-weight: 800; letter-spacing: -.05em; }
  h1 .soft { display: block; padding-bottom: .26em; margin-bottom: -.26em; background: linear-gradient(180deg, #ffffff 0%, #8f8f8f 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .sub { margin-top: 30px; font-size: 32px; line-height: 1.4; color: var(--muted); font-weight: 500; max-width: 720px; }

  .chips { margin-top: 44px; display: flex; gap: 14px; flex-wrap: wrap; }
  .chip {
    padding: 14px 24px; border-radius: 14px; border: 1px solid var(--line); background: var(--card);
    font-size: 24px; font-weight: 600; color: #ededed;
  }
  .chip.solid { background: #fff; color: #0a0a0a; border-color: #fff; }

  /* right: admin panel screenshots (1280x900 css px @2x) */
  .stage { position: absolute; inset: 0; perspective: 2200px; z-index: 2; }
  .shot {
    position: absolute; width: 1280px; height: 900px; border-radius: 18px; overflow: hidden;
    border: 1px solid rgba(255,255,255,.14);
    background-size: 100% 100%; background-repeat: no-repeat;
    box-shadow: 0 50px 120px rgba(0,0,0,.75), 0 0 0 1px rgba(0,0,0,.6);
    transform-origin: left center;
  }
  /* front: overview */
  .overview {
    background-image: url("01-overview.png");
    left: 900px; top: 150px;
    transform: rotateY(-16deg) rotateX(3deg) scale(.86);
  }
  /* back: detector list */
  .detectors {
    background-image: url("02-detectors.png");
    left: 1230px; top: -60px;
    transform: rotateY(-16deg) rotateX(3deg) scale(.6);
    opacity: .5;
  }

  /* latest alarms card from the overview: element screenshot @4x (581x331 css px) */
  .alarms {
    position: absolute; z-index: 4; left: 905px; top: 640px; width: 600px; height: calc(600px * 1324 / 2324);
    background: url("part-latest-alarms@4x.png") no-repeat; background-size: 100% 100%;
    border-radius: 16px;
    box-shadow: 0 30px 80px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.10);
  }

  .fade-right { position: absolute; right: 0; top: 0; bottom: 0; width: 160px; background: linear-gradient(90deg, transparent, var(--bg)); z-index: 3; }
  .fade-left { position: absolute; left: 0; top: 0; bottom: 0; width: 980px; background: linear-gradient(90deg, var(--bg) 62%, rgba(10,10,10,.85) 80%, transparent); z-index: 3; }

  .badge {
    position: absolute; right: 64px; top: 56px; z-index: 6;
    display: flex; align-items: center; gap: 12px;
    font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; letter-spacing: .14em; color: #fff;
    padding: 10px 18px; border-radius: 12px; border: 1px solid var(--line); background: rgba(10,10,10,.75);
  }
  .badge .dot { width: 12px; height: 12px; box-shadow: 0 0 14px rgba(248,113,113,.95); }
</style>
</head>
<body>
  <div class="grid"></div>
  <div class="glow"></div>
  <div class="glow-accent"></div>

  <div class="stage">
    <div class="shot detectors"></div>
    <div class="shot overview"></div>
  </div>
  <div class="fade-left"></div>
  <div class="fade-right"></div>

  <div class="alarms"></div>

  <div class="badge"><span class="dot"></span>METAL DETECTED</div>

  <div class="left">
    <div class="brand">
      <img src="logo.svg" alt="">
      <span class="name">HypeScripts</span>
      <span class="sep"></span>
      <span class="tag">FiveM Script</span>
    </div>

    <div class="pill"><span class="dot"></span>Security</div>
    <h1>Metal<span class="soft">Detector</span></h1>
    <p class="sub">Walk-through gates and hand detectors that alert police and security.</p>

    <div class="chips">
      <span class="chip solid">Admin Panel</span>
      <span class="chip">Hand Detector</span>
      <span class="chip">ESX · QB · QBX</span>
    </div>
  </div>
</body>
</html>
